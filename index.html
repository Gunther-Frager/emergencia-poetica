<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Poetic Emergence (Autonomous)</title>
  <style>
    body { background:#0e0e0e; color:#eaeaea; font-family:monospace; padding:20px; }
    #text { font-size:22px; margin-bottom:20px; }
    .log { opacity:0.7; font-size:14px; white-space:pre-line; }
    button { margin:5px; padding:6px; }
  </style>
</head>
<body>

<h2>Poetic Emergent System</h2>
<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>

<div id="text"></div>
<div id="log" class="log"></div>

<script>

// =========================
// CENTRAL CONFIGURATION
// =========================

const CONFIG = {
  maxWords: 10,
  tickDelay: 1200,
  memoryLimit: 12,

  // persistence
  storageKey: "poetic-system-state",

  // LLM endpoint (IMPORTANT)
  // You MUST point this to your own backend proxy
  // (GitHub secrets are NOT accessible from frontend)
  apiUrl: "https://poetic.layuspatricio.workers.dev/",

  model: "gpt-4o-mini",
  temperature: 0.8
};

// =========================
// AGENT DEFINITIONS & BEHAVIORS
// =========================
// 
// Cada agente tiene un rol específico con acciones permitidas.
// El sistema se basa en la creatividad del LLM, no en listas de palabras.
// Los agentes deben decidir acciones a partir del texto y su rol.
//

const AGENTS = {
  
  // -------- AGENTE A: EXPANSION --------
  // Rol: expandir el texto poéticamente
  // Acciones permitidas: add (expandir), replace (transformar), noop (solo si no hay alternativa)
  // Estrategia: preferir agregar palabras; solo reemplazar si está lleno
  //
  A: {
    name: "Expansion",
    role: `You expand text poetically.
- Add imagery
- Introduce ambiguity
- Stretch meaning`,
    rules: `You may add words at the beginning, middle or end of the text.
- Prefer adding vivid imagery.
- Replace only when a stronger image or phrase helps.
- Use noop only if no safe poetic edit is possible.`,
    allowedActions: ["add", "replace", "noop"]
  },

  // -------- AGENTE B: COMPRESSION --------
  // Rol: reducir/simplificar el texto
  // Acciones permitidas: remove (eliminar), replace (transformar), noop (solo si no hay alternativa)
  B: {
    name: "Compression",
    role: `You reduce text.
- Remove redundancy
- Simplify meaning
- Seek clarity`,
    rules: `You may remove or replace words from the beginning, middle or end of the text.
- Prefer removing weak or redundant words.
- Replace only when it clarifies meaning.
- Use noop only if no valid reduction or improvement exists.`,
    allowedActions: ["remove", "replace", "noop"]
  }
};

// =========================
// STATE
// =========================

let state = {
  text: "el sonido",
  memory: [],
  tick: 0,
  running: false
};

// =========================
// PERSISTENCE
// =========================

function saveState() {
  localStorage.setItem(CONFIG.storageKey, JSON.stringify(state));
}

function loadState() {
  const saved = localStorage.getItem(CONFIG.storageKey);
  if (saved) state = JSON.parse(saved);
}

function reset() {
  localStorage.removeItem(CONFIG.storageKey);
  state = { text: "el sonido", memory: [], tick: 0, running: false };
  render();
}

// =========================
// UTILS
// =========================

function words(t) { return t.split(" ").filter(Boolean); }

function applyAction(action) {
  let ws = words(state.text);
  if (action.type === "noop") return;

  if (action.type === "add") {
    const payload = typeof action.payload === "string"
      ? { text: action.payload, position: "end" }
      : action.payload || { text: "", position: "end" };

    const added = words(payload.text || "");
    if (!added.length) return;

    if (payload.position === "start") {
      state.text = added.concat(ws).slice(0, CONFIG.maxWords).join(" ");
    } else {
      state.text = ws.concat(added).slice(0, CONFIG.maxWords).join(" ");
    }
    return;
  }

  if (action.type === "remove") {
    const index = ws.indexOf(action.payload);
    if (index !== -1) {
      ws.splice(index, 1);
    }
    state.text = ws.join(" ");
    return;
  }

  if (action.type === "replace") {
    let replaced = false;
    state.text = ws.map(w => {
      if (!replaced && w === action.payload.from) {
        replaced = true;
        return action.payload.to;
      }
      return w;
    }).join(" ");
  }
}

function safeParse(str) {
  try {
    const json = str.match(/{[\s\S]*}/);
    return json ? JSON.parse(json[0]) : { type: "noop" };
  } catch {
    return { type: "noop" };
  }
}

function validateAction(action, agentKey) {
  if (!action || typeof action !== "object") return false;
  const agent = AGENTS[agentKey];
  if (!agent.allowedActions.includes(action.type)) return false;

  const currentWords = words(state.text);
  const availableWords = currentWords.length;

  if (action.type === "add") {
    const payload = typeof action.payload === "string"
      ? { text: action.payload, position: "end" }
      : action.payload || {};

    if (typeof payload.text !== "string") return false;
    const added = words(payload.text.trim());
    if (!added.length) return false;
    if (payload.position && !["start", "end"].includes(payload.position)) return false;
    return availableWords + added.length <= CONFIG.maxWords;
  }

  if (action.type === "remove") {
    return typeof action.payload === "string" && action.payload.trim().length > 0 && currentWords.includes(action.payload);
  }

  if (action.type === "replace") {
    if (!action.payload || typeof action.payload !== "object") return false;
    const from = String(action.payload.from || "").trim();
    const to = String(action.payload.to || "").trim();
    if (!from || !to) return false;
    if (!currentWords.includes(from)) return false;
    return availableWords - 1 + words(to).length <= CONFIG.maxWords;
  }

  return action.type === "noop";
}

// =========================
// ACTION NORMALIZATION
// =========================
//
// No usamos un fallback con palabras predeterminadas.
// Si el modelo produce algo inválido, conservamos el texto y no cambiamos nada.
// Esto preserva creatividad y evita anclar el sistema a frases predefinidas.
//

function normalizeAction(rawAction, agentKey) {
  if (validateAction(rawAction, agentKey) && rawAction.type !== "noop") {
    return rawAction;
  }
  return { type: "noop" };
}

// =========================
// PROMPT BUILDER
// =========================

function buildPrompt(agentKey) {
  const agent = AGENTS[agentKey];
  const memory = state.memory.slice(-3).map((line, index) => `${index + 1}. ${line}`).join("\n") || "none";

  return `You are a constrained poetic editor. You do not write full poetry yourself; you select a single edit action to transform the shared text.

Role:
${agent.role}

Current text:
"${state.text}"

Recent memory:
${memory}

Rules:
- Respond with EXACTLY one JSON object.
- Do not write explanations, no markdown, no code fences.
- Resulting text must stay within ${CONFIG.maxWords} words.
- Do not rely on canned fallback words or explicit hardcoded lists.
- Decide actions from the current text and the agent's role.
- Prefer add/replace/remove; use noop only if there is no better valid edit.
- Keep the system emergent: preserve some coherence while allowing surprise.
- ${agent.rules}

Allowed actions:
${agent.allowedActions.join("\n")}

JSON schema:
{
  "type": "add" | "remove" | "replace" | "noop",
  "payload": string OR { "text": string, "position": "start" | "end" } OR { "from": string, "to": string }
}

Examples:
For text "el sonido"
{ "type": "add", "payload": { "text": "un susurro", "position": "start" } }

For text "el sonido del viento"
{ "type": "replace", "payload": { "from": "viento", "to": "mar" } }

For text "el sonido mar"
{ "type": "remove", "payload": "el" }

Output:
`;
}

// =========================
// LLM CALL (via backend)
// =========================

async function callLLM(prompt) {
  const res = await fetch(CONFIG.apiUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: CONFIG.model,
      prompt,
      temperature: CONFIG.temperature
    })
  });

  const data = await res.json();
  return data.output;
}

// =========================
// LOOP
// =========================

async function step() {
  state.tick++;
  const beforeText = state.text;

  const aRaw = await callLLM(buildPrompt("A"));
  const actionA = normalizeAction(safeParse(aRaw), "A");
  applyAction(actionA);
  const afterA = state.text;

  const bRaw = await callLLM(buildPrompt("B"));
  const actionB = normalizeAction(safeParse(bRaw), "B");
  applyAction(actionB);
  const afterB = state.text;

  state.memory.push(state.text);
  if (state.memory.length > CONFIG.memoryLimit) state.memory.shift();

  console.log("----- TICK", state.tick, "-----");
  console.log("TEXT BEFORE:", beforeText);
  console.log("A RAW:", aRaw);
  console.log("A ACTION:", actionA);
  console.log("AFTER A:", afterA);
  console.log("B RAW:", bRaw);
  console.log("B ACTION:", actionB);
  console.log("TEXT AFTER:", afterB);

  saveState();
  render(actionA, actionB, beforeText, afterA, afterB, aRaw, bRaw);
}

async function loop() {
  while (state.running) {
    await step();
    await new Promise(r => setTimeout(r, CONFIG.tickDelay));
  }
}

function start() {
  if (!state.running) {
    state.running = true;
    loop();
  }
}

function stop() {
  state.running = false;
}

// =========================
// RENDER
// =========================

function render(a = {type:"-"}, b = {type:"-"}, before = "", afterA = "", afterB = "", aRaw = "", bRaw = "") {
  document.getElementById("text").innerText = state.text;
  document.getElementById("log").innerText =
`tick: ${state.tick}

A (${AGENTS.A.name}) → ${a.type}
B (${AGENTS.B.name}) → ${b.type}

before:
${before}

after A:
${afterA}

after B:
${afterB}

raw A:
${aRaw}

raw B:
${bRaw}

memory:
${state.memory.slice(-5).join("\n")}`;
}

// =========================
// INIT
// =========================

loadState();
render();

</script>

</body>
</html>
